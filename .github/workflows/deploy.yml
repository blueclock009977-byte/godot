name: Deploy Tsum Puzzle to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          TEMPLATE_DIR="/root/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          cd /tmp && unzip -o templates.tpz
          cp /tmp/templates/* "$TEMPLATE_DIR/"
          rm -rf /tmp/templates /tmp/templates.tpz

      - name: Import and export
        run: |
          cd tsum-game-godogen
          rm -rf .godot

          # Save real project.godot
          cp project.godot project.godot.real

          # Use dice-deck's project.godot as base (known to export)
          # but patch ALL settings for tsum-game
          cp ../dice-deck-random/project.godot project.godot

          # Patch for tsum-game
          sed -i 's|run/main_scene=.*|run/main_scene="res://scenes/title.tscn"|' project.godot
          sed -i 's|config/name=.*|config/name="TsumPuzzle"|' project.godot
          sed -i 's|window/size/viewport_width=.*|window/size/viewport_width=540|' project.godot
          sed -i 's|window/size/viewport_height=.*|window/size/viewport_height=960|' project.godot
          sed -i 's|window/stretch/aspect=.*|window/stretch/aspect="keep"|' project.godot

          # Remove dice-deck autoloads and add tsum ones
          sed -i '/^\[autoload\]/,/^\[/{//!d}' project.godot
          sed -i '/^\[autoload\]/a GameManager="*res://scripts/game_manager.gd"\nPartyManager="*res://scripts/party_manager.gd"\nCharacterData="*res://scripts/data/characters.gd"' project.godot

          # Remove physics section (tsum doesn't need Jolt)
          sed -i '/^\[physics\]/,/^\[/{//!d}' project.godot
          sed -i '/^\[physics\]$/d' project.godot

          echo "=== Export project.godot ==="
          cat project.godot

          timeout 60 godot --headless --import 2>&1 || true
          sleep 2

          mkdir -p build/web
          timeout 120 godot --headless --export-release "Web" build/web/index.html 2>&1 || true

          # Restore
          mv project.godot.real project.godot

          ls -la build/web/
          if [ ! -f build/web/index.html ]; then
            echo "EXPORT FAILED"
            exit 1
          fi

          cd build/web
          TIMESTAMP=$(date +%s)
          sed -i "s|<head>|<head>\n<script>if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})});caches.keys().then(function(c){c.forEach(function(n){caches.delete(n)})})}</script>\n<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n<meta http-equiv=\"Pragma\" content=\"no-cache\">\n<meta http-equiv=\"Expires\" content=\"0\">|" index.html
          sed -i 's/navigator\.serviceWorker\.register/\/\/navigator.serviceWorker.register/g' index.html
          rm -f *.worker.js *.service.worker.js sw.js service-worker.js

          for f in *.js; do
            if [ -f "$f" ]; then
              sed -i "s/serviceWorker/____disabled____/g" "$f"
            fi
          done

          for f in *.js *.wasm *.pck; do
            if [ -f "$f" ]; then
              sed -i "s|${f}|${f}?v=${TIMESTAMP}|g" index.html
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tsum-game-godogen/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

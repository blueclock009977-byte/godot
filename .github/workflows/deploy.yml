name: Deploy Tsum Puzzle to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          mkdir -p "/root/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          cd /tmp && unzip -o templates.tpz
          cp /tmp/templates/* "$TEMPLATE_DIR/"
          cp /tmp/templates/* "/root/.local/share/godot/export_templates/4.4.1.stable/"
          rm -rf /tmp/templates /tmp/templates.tpz

      - name: Import and export
        run: |
          cd tsum-game-godogen

          echo "=== Step 1: Validate script (try loading one) ==="
          timeout 30 godot --headless --script res://scripts/title.gd --quit 2>&1 || echo "script check done"

          echo "=== Step 2: Import with verbose ==="
          timeout 60 godot --headless --import --verbose 2>&1 | tail -50 || true
          sleep 2

          echo "=== Step 3: Check editor data ==="
          find "$HOME/.local/share/godot" -name "*.cfg" 2>/dev/null | head -10
          find /root/.local/share/godot -name "*.cfg" 2>/dev/null | head -10
          echo "=== Godot --help export flags ==="
          godot --help 2>&1 | grep -i export || true

          echo "=== Step 4: Export ==="
          mkdir -p build/web
          timeout 120 godot --headless --export-release "Web" build/web/index.html 2>&1

          ls -la build/web/

          if [ ! -f build/web/index.html ]; then
            echo "EXPORT FAILED"
            exit 1
          fi

          cd build/web
          TIMESTAMP=$(date +%s)
          sed -i "s|<head>|<head>\n<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n<meta http-equiv=\"Pragma\" content=\"no-cache\">\n<meta http-equiv=\"Expires\" content=\"0\">|" index.html
          sed -i 's/navigator\.serviceWorker\.register/\/\/navigator.serviceWorker.register/g' index.html
          rm -f *.worker.js *.service.worker.js sw.js service-worker.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tsum-game-godogen/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Tsum Puzzle to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          echo "HOME=$HOME"
          TEMPLATE_DIR="/root/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          cd /tmp && unzip -o templates.tpz
          cp /tmp/templates/* "$TEMPLATE_DIR/"
          echo "Web templates:"
          ls "$TEMPLATE_DIR/" | grep web
          rm -rf /tmp/templates /tmp/templates.tpz

      - name: Import project
        run: |
          cd tsum-game-godogen
          timeout 60 godot --headless --import 2>&1 || true
          sleep 2

      - name: Export Web build
        run: |
          mkdir -p tsum-game-godogen/build/web
          cd tsum-game-godogen
          godot --headless --export-release "Web" build/web/index.html 2>&1 || true
          ls -la build/web/
          if [ ! -f build/web/index.html ]; then
            echo "=== FAILED WITH HOME=/root ==="
            echo "=== Trying with editor-data-dir flag ==="
            godot --headless --editor-data-dir /root/.local/share/godot --export-release "Web" build/web/index.html 2>&1 || true
            ls -la build/web/
          fi
          if [ ! -f build/web/index.html ]; then
            echo "EXPORT FAILED"
            exit 1
          fi

          cd build/web
          TIMESTAMP=$(date +%s)
          sed -i "s|<head>|<head>\n<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n<meta http-equiv=\"Pragma\" content=\"no-cache\">\n<meta http-equiv=\"Expires\" content=\"0\">|" index.html
          sed -i 's/navigator\.serviceWorker\.register/\/\/navigator.serviceWorker.register/g' index.html
          rm -f *.worker.js *.service.worker.js sw.js service-worker.js

          for f in *.js; do
            if [ -f "$f" ]; then
              sed -i "s/serviceWorker/____disabled____/g" "$f"
            fi
          done

          for f in *.js *.wasm *.pck; do
            if [ -f "$f" ]; then
              sed -i "s|${f}|${f}?v=${TIMESTAMP}|g" index.html
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tsum-game-godogen/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Tsum Puzzle to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          TEMPLATE_DIR="/root/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          cd /tmp && unzip -o templates.tpz
          cp /tmp/templates/* "$TEMPLATE_DIR/"
          rm -rf /tmp/templates /tmp/templates.tpz

      - name: Test dice-deck-random export first
        run: |
          echo "=== Testing dice-deck-random (known working) ==="
          cd dice-deck-random
          timeout 60 godot --headless --import 2>&1 || true
          sleep 2
          mkdir -p /tmp/test-build
          timeout 120 godot --headless --export-release "Web" /tmp/test-build/index.html 2>&1 || true
          echo "=== dice-deck result ==="
          ls -la /tmp/test-build/
          if [ -f /tmp/test-build/index.html ]; then
            echo "SUCCESS: dice-deck-random can export!"
          else
            echo "FAIL: dice-deck-random also cannot export!"
          fi
          rm -rf /tmp/test-build

      - name: Export tsum-game-godogen
        run: |
          cd tsum-game-godogen
          timeout 60 godot --headless --import 2>&1 || true
          sleep 2
          mkdir -p build/web
          timeout 120 godot --headless --export-release "Web" build/web/index.html 2>&1 || true
          echo "=== tsum result ==="
          ls -la build/web/
          if [ ! -f build/web/index.html ]; then
            echo "EXPORT FAILED"
            exit 1
          fi

          cd build/web
          TIMESTAMP=$(date +%s)
          sed -i "s|<head>|<head>\n<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n<meta http-equiv=\"Pragma\" content=\"no-cache\">\n<meta http-equiv=\"Expires\" content=\"0\">|" index.html
          sed -i 's/navigator\.serviceWorker\.register/\/\/navigator.serviceWorker.register/g' index.html
          rm -f *.worker.js *.service.worker.js sw.js service-worker.js

          for f in *.js; do
            if [ -f "$f" ]; then
              sed -i "s/serviceWorker/____disabled____/g" "$f"
            fi
          done

          for f in *.js *.wasm *.pck; do
            if [ -f "$f" ]; then
              sed -i "s|${f}|${f}?v=${TIMESTAMP}|g" index.html
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tsum-game-godogen/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

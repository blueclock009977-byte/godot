name: Deploy Tsum Puzzle to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          TEMPLATE_DIR="/root/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          cd /tmp && unzip -o templates.tpz
          cp /tmp/templates/* "$TEMPLATE_DIR/"
          rm -rf /tmp/templates /tmp/templates.tpz

      - name: Nuclear test - export dice-deck from tsum dir
        run: |
          echo "=== TEST 1: Export tsum with dice-deck's project.godot ==="
          cd tsum-game-godogen
          # Remove .godot cache
          rm -rf .godot
          # Copy dice-deck's project.godot
          cp ../dice-deck-random/project.godot project.godot.bak
          # But keep tsum's main scene
          cat project.godot
          echo "---"
          # Try export directly without import
          mkdir -p build/web
          timeout 120 godot --headless --export-release "Web" build/web/index.html 2>&1 || true
          ls -la build/web/
          if [ -f build/web/index.html ]; then
            echo "SUCCESS with current project.godot!"
          else
            echo "FAILED - trying without import..."
          fi

          echo "=== TEST 2: Copy entire dice-deck setup ==="
          # Use dice-deck's project.godot as-is
          cp ../dice-deck-random/project.godot project.godot
          rm -rf .godot build/web
          mkdir -p build/web
          timeout 60 godot --headless --import 2>&1 || true
          sleep 2
          timeout 120 godot --headless --export-release "Web" build/web/index.html 2>&1 || true
          ls -la build/web/
          if [ -f build/web/index.html ]; then
            echo "SUCCESS with dice-deck project.godot!"
          else
            echo "ALSO FAILED with dice-deck project.godot - issue is in the FILES"
          fi

          # Restore original
          if [ -f project.godot.bak ]; then
            mv project.godot.bak project.godot
          fi

          if [ ! -f build/web/index.html ]; then
            echo "EXPORT FAILED"
            exit 1
          fi

          cd build/web
          TIMESTAMP=$(date +%s)
          sed -i "s|<head>|<head>\n<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">|" index.html
          sed -i 's/navigator\.serviceWorker\.register/\/\/navigator.serviceWorker.register/g' index.html
          rm -f *.worker.js *.service.worker.js sw.js service-worker.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tsum-game-godogen/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- ソウルリーパー - 魂狩り 🌑✨ -->
  <!-- ローブ -->
  <rect x="4" y="5" width="8" height="10" fill="#1A1A2E"/>
  <rect x="3" y="6" width="2" height="8" fill="#2D1B4E"/>
  <rect x="11" y="6" width="2" height="8" fill="#2D1B4E"/>
  <!-- フード -->
  <rect x="4" y="2" width="8" height="5" fill="#1A1A2E"/>
  <rect x="5" y="1" width="6" height="2" fill="#2D1B4E"/>
  <!-- 顔（闇） -->
  <rect x="5" y="3" width="6" height="4" fill="#000000"/>
  <!-- 目 -->
  <rect x="6" y="4" width="1" height="1" fill="#FFD700"/>
  <rect x="9" y="4" width="1" height="1" fill="#FFD700"/>
  <!-- 光のオーラ -->
  <rect x="3" y="3" width="1" height="1" fill="#FFFF00" fill-opacity="0.5"/>
  <rect x="12" y="4" width="1" height="1" fill="#FFFF00" fill-opacity="0.5"/>
  <rect x="2" y="8" width="1" height="1" fill="#E6E6FA" fill-opacity="0.5"/>
  <rect x="13" y="9" width="1" height="1" fill="#E6E6FA" fill-opacity="0.5"/>
  <!-- 鎌 -->
  <rect x="13" y="1" width="1" height="8" fill="#C0C0C0"/>
  <rect x="11" y="1" width="3" height="2" fill="#C0C0C0"/>
  <rect x="10" y="2" width="2" height="1" fill="#87CEEB"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- ソーラーライオン - 太陽の獅子 ✨🔥 -->
  <rect x="4" y="6" width="8" height="6" fill="#FF8C00"/>
  <rect x="3" y="4" width="10" height="4" fill="#FFA500"/>
  <!-- たてがみ（太陽） -->
  <rect x="1" y="2" width="12" height="4" fill="#FFD700"/>
  <rect x="2" y="1" width="10" height="2" fill="#FFEC8B"/>
  <rect x="3" y="0" width="8" height="2" fill="#FFD700"/>
  <!-- 顔 -->
  <rect x="4" y="3" width="6" height="4" fill="#FFA500"/>
  <!-- 目 -->
  <rect x="5" y="4" width="2" height="2" fill="#FFFFFF"/>
  <rect x="8" y="4" width="2" height="2" fill="#FFFFFF"/>
  <rect x="6" y="5" width="1" height="1" fill="#8B0000"/>
  <rect x="8" y="5" width="1" height="1" fill="#8B0000"/>
  <!-- 鼻 -->
  <rect x="7" y="6" width="2" height="1" fill="#8B4513"/>
  <!-- 足 -->
  <rect x="4" y="12" width="2" height="3" fill="#FF8C00"/>
  <rect x="10" y="12" width="2" height="3" fill="#FF8C00"/>
  <!-- 尻尾 -->
  <rect x="12" y="8" width="3" height="2" fill="#FF8C00"/>
  <rect x="14" y="7" width="1" height="2" fill="#FFD700"/>
</svg>

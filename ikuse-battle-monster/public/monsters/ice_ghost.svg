<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- アイスゴースト - 凍える亡霊 ❄️🌑 -->
  <rect x="4" y="3" width="8" height="10" fill="#E0FFFF" fill-opacity="0.8"/>
  <rect x="3" y="5" width="2" height="6" fill="#B0E0E6" fill-opacity="0.6"/>
  <rect x="11" y="5" width="2" height="6" fill="#B0E0E6" fill-opacity="0.6"/>
  <!-- 目 -->
  <rect x="5" y="5" width="2" height="3" fill="#4B0082"/>
  <rect x="9" y="5" width="2" height="3" fill="#4B0082"/>
  <rect x="5" y="6" width="1" height="1" fill="#FF0000"/>
  <rect x="10" y="6" width="1" height="1" fill="#FF0000"/>

  <!-- 電気装飾 -->
  <rect x="5" y="7" width="1" height="1" fill="#FFD700"/>
  <rect x="10" y="7" width="1" height="1" fill="#FFD700"/>
  <rect x="7" y="9" width="2" height="1" fill="#FFD700"/>
  <!-- 剣 -->
  <rect x="12" y="3" width="2" height="8" fill="#C0C0C0"/>
  <rect x="11" y="6" width="4" height="1" fill="#808080"/>
  <!-- 足 -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- ダークナイト - 暗黒騎士 🌑⚡ -->
  <!-- 鎧 -->
  <rect x="4" y="5" width="8" height="8" fill="#2F2F2F"/>
  <rect x="5" y="4" width="6" height="2" fill="#1A1A1A"/>

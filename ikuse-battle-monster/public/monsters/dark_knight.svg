  <rect x="4" y="2" width="8" height="4" fill="#1A1A1A"/>
  <rect x="5" y="1" width="6" height="2" fill="#2F2F2F"/>
  <!-- バイザー -->
  <rect x="5" y="3" width="6" height="2" fill="#4B0082"/>
  <!-- 目（光る） -->
  <rect x="6" y="3" width="1" height="1" fill="#FF0000"/>

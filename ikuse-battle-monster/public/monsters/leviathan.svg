  <!-- 目 -->
  <rect x="12" y="4" width="2" height="2" fill="#FF0000"/>
  <rect x="12" y="4" width="1" height="1" fill="#FFFFFF"/>
  <!-- 牙 -->
  <rect x="10" y="7" width="1" height="2" fill="#FFFFFF"/>
  <rect x="13" y="7" width="1" height="2" fill="#FFFFFF"/>
  <!-- ヒレ -->
  <rect x="5" y="3" width="3" height="3" fill="#4169E1"/>
  <rect x="6" y="2" width="1" height="2" fill="#6495ED"/>

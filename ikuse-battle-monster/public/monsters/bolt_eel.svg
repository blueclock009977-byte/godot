<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- ボルトイール - 電気ウナギ ⚡💧 -->
  <rect x="2" y="7" width="12" height="3" fill="#4682B4"/>
  <rect x="1" y="8" width="2" height="2" fill="#4682B4"/>
  <rect x="13" y="7" width="2" height="2" fill="#4682B4"/>
  <!-- 頭 -->
  <rect x="10" y="5" width="4" height="4" fill="#5F9EA0"/>
  <!-- 目 -->
  <rect x="12" y="6" width="2" height="2" fill="#FFFF00"/>
  <rect x="13" y="6" width="1" height="1" fill="#1A1A2E"/>
  <!-- 電気模様 -->
  <rect x="3" y="7" width="1" height="1" fill="#FFD700"/>
  <rect x="5" y="8" width="1" height="1" fill="#FFD700"/>
  <rect x="7" y="7" width="1" height="1" fill="#FFD700"/>
  <rect x="9" y="8" width="1" height="1" fill="#FFD700"/>
  <!-- 尾 -->
  <rect x="0" y="6" width="2" height="1" fill="#4682B4"/>
  <rect x="0" y="9" width="2" height="1" fill="#4682B4"/>
  <!-- 電気エフェクト -->
  <rect x="4" y="5" width="1" height="1" fill="#FFFF00" fill-opacity="0.7"/>
  <rect x="8" y="10" width="1" height="1" fill="#FFFF00" fill-opacity="0.7"/>
</svg>

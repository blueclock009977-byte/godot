<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- ホーリーユニコーン - 聖なる一角獣 ✨🌪️ -->
  <rect x="4" y="6" width="8" height="6" fill="#FFFFFF"/>
  <rect x="3" y="4" width="6" height="4" fill="#FFFAFA"/>
  <!-- 角 -->
  <rect x="5" y="0" width="2" height="5" fill="#FFD700"/>
  <rect x="6" y="0" width="1" height="3" fill="#FFEC8B"/>
  <!-- たてがみ -->
  <rect x="2" y="3" width="2" height="5" fill="#E6E6FA"/>
  <rect x="1" y="4" width="2" height="3" fill="#DDA0DD"/>
  <!-- 目 -->
  <rect x="4" y="5" width="2" height="2" fill="#4169E1"/>
  <rect x="4" y="5" width="1" height="1" fill="#FFFFFF"/>
  <!-- 鼻 -->
  <rect x="7" y="6" width="2" height="1" fill="#FFB6C1"/>
  <!-- 足 -->
  <rect x="4" y="12" width="2" height="3" fill="#FFFFFF"/>
  <rect x="10" y="12" width="2" height="3" fill="#FFFFFF"/>
  <!-- 蹄 -->
  <rect x="4" y="14" width="2" height="1" fill="#C0C0C0"/>
  <rect x="10" y="14" width="2" height="1" fill="#C0C0C0"/>
  <!-- キラキラ -->
  <rect x="8" y="2" width="1" height="1" fill="#FFFF00"/>
  <rect x="0" y="6" width="1" height="1" fill="#FFFF00"/>
</svg>

  <rect x="13" y="5" width="3" height="5" fill="#808080"/>
  <!-- 拳 -->
  <rect x="0" y="9" width="3" height="3" fill="#A9A9A9"/>
  <rect x="13" y="9" width="3" height="3" fill="#A9A9A9"/>

  <rect x="7" y="6" width="2" height="1" fill="#FF69B4"/>
  <!-- 足 -->
  <rect x="4" y="11" width="2" height="3" fill="#FF4500"/>
  <rect x="10" y="11" width="2" height="3" fill="#FF4500"/>

  <rect x="11" y="1" width="2" height="3" fill="#FF4500"/>
  <!-- 目（鋭い） -->
  <rect x="4" y="4" width="3" height="2" fill="#FFFF00"/>
  <rect x="9" y="4" width="3" height="2" fill="#FFFF00"/>
  <rect x="5" y="4" width="1" height="2" fill="#1A1A2E"/>
  <rect x="10" y="4" width="1" height="2" fill="#1A1A2E"/>

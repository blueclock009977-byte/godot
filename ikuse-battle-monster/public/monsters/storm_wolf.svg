<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- ストームウルフ - 風の狼 🌪️ -->
  <rect x="3" y="5" width="10" height="6" fill="#708090"/>
  <rect x="2" y="3" width="8" height="4" fill="#778899"/>
  <!-- 耳 -->
  <rect x="2" y="1" width="2" height="3" fill="#708090"/>
  <rect x="7" y="1" width="2" height="3" fill="#708090"/>
  <!-- 目 -->
  <rect x="3" y="4" width="2" height="2" fill="#00CED1"/>
  <rect x="6" y="4" width="2" height="2" fill="#00CED1"/>
  <rect x="4" y="4" width="1" height="1" fill="#1A1A2E"/>
  <rect x="7" y="4" width="1" height="1" fill="#1A1A2E"/>
  <!-- 鼻 -->
  <rect x="9" y="5" width="3" height="2" fill="#2F4F4F"/>
  <rect x="11" y="5" width="1" height="1" fill="#1A1A2E"/>
  <!-- 足 -->
  <rect x="3" y="11" width="2" height="3" fill="#708090"/>
  <rect x="7" y="11" width="2" height="3" fill="#708090"/>
  <rect x="10" y="11" width="2" height="3" fill="#708090"/>
  <!-- 尻尾 -->
  <rect x="12" y="6" width="3" height="2" fill="#778899"/>
  <!-- 風エフェクト -->
  <rect x="0" y="4" width="2" height="1" fill="#E0FFFF" fill-opacity="0.6"/>
  <rect x="14" y="3" width="2" height="1" fill="#E0FFFF" fill-opacity="0.6"/>
</svg>

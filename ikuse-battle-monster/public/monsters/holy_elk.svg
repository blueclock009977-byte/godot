<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" style="image-rendering: pixelated;">
  <!-- ホーリーエルク - 聖なる鹿 ✨🪨 -->
  <rect x="4" y="6" width="8" height="6" fill="#D2B48C"/>
  <rect x="3" y="4" width="6" height="4" fill="#DEB887"/>
  <!-- 角 -->
  <rect x="3" y="1" width="2" height="4" fill="#8B4513"/>
  <rect x="1" y="2" width="2" height="2" fill="#8B4513"/>
  <rect x="4" y="0" width="1" height="2" fill="#8B4513"/>
  <rect x="7" y="1" width="2" height="4" fill="#8B4513"/>
  <rect x="9" y="2" width="2" height="2" fill="#8B4513"/>
  <rect x="7" y="0" width="1" height="2" fill="#8B4513"/>
  <!-- 角の光 -->
  <rect x="2" y="1" width="1" height="1" fill="#FFD700"/>
  <rect x="9" y="1" width="1" height="1" fill="#FFD700"/>
  <!-- 目 -->
  <rect x="4" y="5" width="2" height="2" fill="#1A1A2E"/>
  <rect x="4" y="5" width="1" height="1" fill="#FFFFFF"/>
  <!-- 鼻 -->
  <rect x="7" y="6" width="2" height="1" fill="#8B4513"/>
  <!-- 模様 -->
  <rect x="6" y="8" width="2" height="2" fill="#FFFACD"/>
  <!-- 足 -->
  <rect x="4" y="12" width="2" height="3" fill="#D2B48C"/>
  <rect x="10" y="12" width="2" height="3" fill="#D2B48C"/>
  <!-- 蹄 -->
  <rect x="4" y="14" width="2" height="1" fill="#696969"/>
  <rect x="10" y="14" width="2" height="1" fill="#696969"/>
</svg>

  <!-- 砂エフェクト -->
  <rect x="2" y="6" width="2" height="1" fill="#DEB887" fill-opacity="0.7"/>
  <rect x="12" y="7" width="2" height="1" fill="#DEB887" fill-opacity="0.7"/>
  <rect x="3" y="10" width="1" height="1" fill="#D2B48C" fill-opacity="0.5"/>
